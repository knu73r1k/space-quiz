<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Exploration Quiz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1b1e2b;
    --muted: #626a80;
    --accent: #5b5bf0;
    --accent-2: #8a5bf0;
    --correct: #22c55e;
    --wrong: #ef4444;
    --track: #e3e6f0;
    --border: rgba(0,0,0,0.06);
    --shadow: 0 10px 30px rgba(30, 34, 60, 0.10);
    --hud-line: rgba(91, 91, 240, 0.45);
    --hud-glow: rgba(91, 91, 240, 0.18);
    --hud-scan: rgba(91, 91, 240, 0.05);
    --mono-font: "SF Mono", "SFMono-Regular", ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1020;
      --card: #171a2e;
      --text: #eef0fb;
      --muted: #9aa1c0;
      --accent: #7c7cff;
      --accent-2: #b07cff;
      --correct: #34d399;
      --wrong: #f87171;
      --track: #262a45;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --hud-line: rgba(124, 124, 255, 0.55);
      --hud-glow: rgba(124, 124, 255, 0.28);
      --hud-scan: rgba(124, 124, 255, 0.06);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,124,255,0.15), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(176,124,255,0.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .starfield {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .starfield .layer {
    position: absolute;
    inset: -10% -10% 0 -10%;
    height: 120%;
    background-repeat: repeat;
    opacity: 0.5;
  }
  .starfield .layer-1 {
    background-image:
      radial-gradient(1.4px 1.4px at 20px 30px, var(--text) 0%, transparent 60%),
      radial-gradient(1.2px 1.2px at 90px 120px, var(--text) 0%, transparent 60%),
      radial-gradient(1px 1px at 150px 60px, var(--text) 0%, transparent 60%),
      radial-gradient(1.3px 1.3px at 210px 160px, var(--text) 0%, transparent 60%),
      radial-gradient(1px 1px at 260px 20px, var(--text) 0%, transparent 60%);
    background-size: 280px 200px;
    opacity: 0.55;
    animation: twinkle-a 6s ease-in-out infinite;
  }
  .starfield .layer-2 {
    background-image:
      radial-gradient(1.6px 1.6px at 40px 80px, var(--accent) 0%, transparent 65%),
      radial-gradient(1.4px 1.4px at 130px 40px, var(--accent-2) 0%, transparent 65%),
      radial-gradient(1.2px 1.2px at 190px 140px, var(--text) 0%, transparent 60%),
      radial-gradient(1.5px 1.5px at 250px 100px, var(--accent) 0%, transparent 65%);
    background-size: 320px 260px;
    opacity: 0.4;
    animation: twinkle-b 8s ease-in-out infinite;
  }
  .starfield .layer-3 {
    background-image:
      radial-gradient(0.9px 0.9px at 60px 10px, var(--text) 0%, transparent 60%),
      radial-gradient(0.9px 0.9px at 170px 90px, var(--text) 0%, transparent 60%),
      radial-gradient(0.9px 0.9px at 100px 170px, var(--text) 0%, transparent 60%),
      radial-gradient(0.9px 0.9px at 240px 50px, var(--text) 0%, transparent 60%),
      radial-gradient(0.9px 0.9px at 20px 130px, var(--text) 0%, transparent 60%);
    background-size: 260px 220px;
    opacity: 0.3;
  }
  @keyframes twinkle-a {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.25; }
  }
  @keyframes twinkle-b {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.5; }
  }
  @media (prefers-reduced-motion: reduce) {
    .starfield .layer-1,
    .starfield .layer-2 {
      animation: none;
      opacity: 0.4;
    }
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }
  header.hero {
    text-align: center;
    margin-bottom: 20px;
  }
  header.hero .icon {
    font-size: 40px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
  }
  header.hero h1 {
    font-size: 20px;
    margin: 8px 0 2px;
    letter-spacing: 0.2px;
  }
  header.hero p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(6deg); }
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--hud-line);
    border-radius: 14px;
    box-shadow: var(--shadow), 0 0 0 1px var(--hud-glow), 0 0 24px var(--hud-glow);
    padding: 26px 22px 22px;
    isolation: isolate;
    overflow: hidden;
  }
  /* HUD corner brackets */
  .card::before,
  .card::after,
  .card .corner-br,
  .card .corner-bl {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    pointer-events: none;
    z-index: 2;
  }
  .card::before {
    top: 6px;
    left: 6px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-radius: 3px 0 0 0;
  }
  .card::after {
    top: 6px;
    right: 6px;
    border-top: 2px solid var(--accent-2);
    border-right: 2px solid var(--accent-2);
    border-radius: 0 3px 0 0;
  }
  .card .corner-bl {
    bottom: 6px;
    left: 6px;
    border-bottom: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-radius: 0 0 0 3px;
  }
  .card .corner-br {
    bottom: 6px;
    right: 6px;
    border-bottom: 2px solid var(--accent-2);
    border-right: 2px solid var(--accent-2);
    border-radius: 0 0 3px 0;
  }
  /* Subtle scanline sweep overlay, decorative only */
  .card .scanlines {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      var(--hud-scan) 0px,
      var(--hud-scan) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.5;
  }
  .card .scanlines::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(to bottom, transparent, var(--hud-glow), transparent);
    animation: scan-sweep 6s linear infinite;
  }
  @keyframes scan-sweep {
    0% { top: -40%; }
    100% { top: 100%; }
  }
  .card > *:not(.scanlines):not(.corner-bl):not(.corner-br) {
    position: relative;
    z-index: 1;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--hud-line);
    font-size: 12.5px;
    color: var(--muted);
    font-family: var(--mono-font);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-variant-numeric: tabular-nums;
  }
  .score-pill {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    font-family: var(--mono-font);
    box-shadow: 0 0 10px var(--hud-glow);
  }
  .progress-track {
    position: relative;
    height: 10px;
    background: var(--track);
    border: 1px solid var(--hud-line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
    background-image: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent 9%,
      var(--hud-line) 9%,
      var(--hud-line) calc(9% + 1px)
    );
    background-color: var(--track);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 8px var(--hud-glow);
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }
  .question-wrap {
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-number {
    font-size: 11.5px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-family: var(--mono-font);
    font-weight: 700;
  }
  .q-number::before {
    content: "▸ ";
  }
  .q-text {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height: 1.4;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    font-family: inherit;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .option:disabled {
    cursor: default;
  }
  .option.correct {
    background: color-mix(in srgb, var(--correct) 18%, var(--card));
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 700;
    animation: pop 0.4s ease;
  }
  .option.wrong {
    background: color-mix(in srgb, var(--wrong) 18%, var(--card));
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 700;
    animation: shake 0.45s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
  }
  .feedback {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .feedback.show { opacity: 1; transform: translateY(0); }
  .feedback.correct { background: color-mix(in srgb, var(--correct) 16%, transparent); color: var(--correct); }
  .feedback.wrong { background: color-mix(in srgb, var(--wrong) 16%, transparent); color: var(--wrong); }
  .next-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    font-family: inherit;
  }
  .next-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .next-btn:active { transform: scale(0.98); }
  /* Results screen */
  .results {
    text-align: center;
    animation: fadeIn 0.4s ease;
    position: relative;
  }
  .results .emoji {
    font-size: 56px;
    margin-bottom: 6px;
    animation: pop 0.5s ease;
  }
  .results.celebrate .emoji {
    font-size: 64px;
    animation: celebrate-pop 0.7s cubic-bezier(.34,1.56,.64,1);
  }
  .results.celebrate .score-big {
    animation: glow-pulse 1.8s ease-in-out infinite;
  }
  @keyframes celebrate-pop {
    0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes glow-pulse {
    0%, 100% { filter: drop-shadow(0 0 2px var(--hud-glow)); }
    50% { filter: drop-shadow(0 0 14px var(--hud-glow)); }
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 8px;
    opacity: 0.9;
    border-radius: 2px;
    animation-name: confetti-fall;
    animation-timing-function: cubic-bezier(.4,0,.6,1);
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes confetti-fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--drift, 0px), 340px, 0) rotate(540deg); opacity: 0; }
  }
  .results h2 {
    margin: 4px 0 2px;
    font-size: 19px;
  }
  .results .score-big {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 10px 0 4px;
  }
  .results p.msg {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .restart-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .restart-btn:active { transform: scale(0.98); }
  .review-toggle {
    width: 100%;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--hud-line);
    background: color-mix(in srgb, var(--accent) 10%, var(--card));
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .review-toggle .chevron {
    font-size: 12px;
    color: var(--muted);
  }
  .review-toggle[aria-expanded="true"] .chevron {
    transform: rotate(180deg);
  }
  .review-panel {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: color-mix(in srgb, var(--bg) 75%, var(--card));
    text-align: left;
    padding: 8px;
    max-height: 190px;
    overflow: auto;
  }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    padding: 9px 10px;
    margin-bottom: 8px;
  }
  .review-item:last-child {
    margin-bottom: 0;
  }
  .review-item .question {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .review-item .answer-row {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .review-item .answer-row strong {
    color: var(--text);
  }
  .review-note {
    margin: 0;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    background: color-mix(in srgb, var(--correct) 18%, transparent);
    color: var(--correct);
    font-weight: 600;
  }
  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .hidden { display: none !important; }

  /* Keyboard focus states */
  .option:focus-visible,
  .next-btn:focus-visible,
  .restart-btn:focus-visible,
  .review-toggle:focus-visible {
    outline: 3px solid var(--accent-2);
    outline-offset: 2px;
    box-shadow: 0 0 0 5px var(--hud-glow);
  }
  .option:focus-visible {
    border-color: var(--accent-2);
  }

  @media (prefers-reduced-motion: reduce) {
    header.hero .icon,
    .card .scanlines::after,
    .option.correct,
    .option.wrong,
    .results .emoji,
    .results.celebrate .emoji,
    .results.celebrate .score-big {
      animation: none !important;
    }
    .progress-fill,
    .option {
      transition: none !important;
    }
    .confetti-piece {
      display: none !important;
    }
  }
</style>
</head>
<body>
<div class="starfield" aria-hidden="true">
  <div class="layer layer-1"></div>
  <div class="layer layer-2"></div>
  <div class="layer layer-3"></div>
</div>
<div class="app">
  <header class="hero">
    <span class="icon">🚀</span>
    <h1>Space Exploration Quiz</h1>
    <p>How well do you know the final frontier?</p>
  </header>

  <div class="card">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="corner-bl" aria-hidden="true"></div>
    <div class="corner-br" aria-hidden="true"></div>
    <div id="quizView">
      <div class="top-row">
        <span id="qCounter">Question 1 / 10</span>
        <span class="score-pill" id="scoreCounter">Score: 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-wrap" id="questionWrap">
        <div class="q-number" id="qNumberLabel">Question 1 of 10</div>
        <p class="q-text" id="qText"></p>
        <div class="options" id="optionsWrap"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <button class="next-btn" id="nextBtn">Next Question →</button>
      </div>
    </div>

    <div id="resultsView" class="results hidden">
      <div class="emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">Mission Complete!</h2>
      <div class="score-big" id="resultScore">0 / 10</div>
      <p class="msg" id="resultMsg"></p>
      <button
        class="review-toggle"
        id="reviewToggle"
        type="button"
        aria-expanded="false"
        aria-controls="reviewPanel"
      >
        Review your answers
        <span class="chevron" aria-hidden="true">▼</span>
      </button>
      <div id="reviewPanel" class="review-panel" hidden></div>
      <button class="restart-btn" id="restartBtn">Restart Mission 🔁</button>
    </div>
  </div>

  <footer>Made with 🌌 for curious minds</footer>
</div>

<script>
(function () {
  const questions = [
    {
      q: "What is the closest planet to the Sun?",
      options: ["Venus", "Mercury", "Mars", "Earth"],
      answer: 1
    },
    {
      q: "What was the first artificial satellite launched into space?",
      options: ["Explorer 1", "Vostok 1", "Sputnik 1", "Apollo 11"],
      answer: 2
    },
    {
      q: "Who was the first human to walk on the Moon?",
      options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
      answer: 2
    },
    {
      q: "Which planet is known as the Red Planet?",
      options: ["Jupiter", "Mars", "Saturn", "Mercury"],
      answer: 1
    },
    {
      q: "What galaxy is Earth located in?",
      options: ["Andromeda", "Triangulum", "Milky Way", "Whirlpool"],
      answer: 2
    },
    {
      q: "Which space agency launched the Perseverance rover?",
      options: ["ESA", "NASA", "Roscosmos", "ISRO"],
      answer: 1
    },
    {
      q: "What is the largest planet in our solar system?",
      options: ["Saturn", "Neptune", "Jupiter", "Uranus"],
      answer: 2
    },
    {
      q: "What do astronauts wear to survive outside a spacecraft?",
      options: ["Diving suit", "Spacesuit", "Wetsuit", "Flight jacket"],
      answer: 1
    },
    {
      q: "Roughly how long does it take light from the Sun to reach Earth?",
      options: ["8 minutes", "8 seconds", "8 hours", "8 days"],
      answer: 0
    },
    {
      q: "What is the name of the space station currently orbiting Earth?",
      options: ["Mir", "Skylab", "Tiangong", "International Space Station"],
      answer: 3
    }
  ];

  const qCounter = document.getElementById('qCounter');
  const qNumberLabel = document.getElementById('qNumberLabel');
  const scoreCounter = document.getElementById('scoreCounter');
  const progressFill = document.getElementById('progressFill');
  const qText = document.getElementById('qText');
  const optionsWrap = document.getElementById('optionsWrap');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const quizView = document.getElementById('quizView');
  const resultsView = document.getElementById('resultsView');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultScore = document.getElementById('resultScore');
  const resultMsg = document.getElementById('resultMsg');
  const reviewToggle = document.getElementById('reviewToggle');
  const reviewPanel = document.getElementById('reviewPanel');
  const restartBtn = document.getElementById('restartBtn');

  let current = 0;
  let score = 0;
  let locked = false;
  let hasRenderedOnce = false;
  let answers = [];

  function setReviewCollapsed(collapsed) {
    reviewToggle.setAttribute('aria-expanded', String(!collapsed));
    reviewPanel.hidden = collapsed;
  }

  function getMissedQuestions() {
    const missed = [];
    for (let i = 0; i < questions.length; i++) {
      const selected = answers[i];
      const item = questions[i];
      if (selected !== item.answer) {
        missed.push({
          question: item.q,
          selectedAnswer: selected === undefined ? 'No answer selected' : item.options[selected],
          correctAnswer: item.options[item.answer]
        });
      }
    }
    return missed;
  }

  function renderReviewSummary() {
    const missed = getMissedQuestions();
    reviewPanel.innerHTML = '';
    if (missed.length === 0) {
      const note = document.createElement('p');
      note.className = 'review-note';
      note.textContent = 'Perfect score! You answered every question correctly. 🌟';
      reviewPanel.appendChild(note);
      return;
    }
    missed.forEach((entry) => {
      const card = document.createElement('article');
      card.className = 'review-item';
      const question = document.createElement('p');
      question.className = 'question';
      question.textContent = entry.question;
      const selected = document.createElement('p');
      selected.className = 'answer-row';
      const selectedLabel = document.createElement('strong');
      selectedLabel.textContent = 'Your answer:';
      selected.appendChild(selectedLabel);
      selected.append(` ${entry.selectedAnswer}`);
      const correct = document.createElement('p');
      correct.className = 'answer-row';
      const correctLabel = document.createElement('strong');
      correctLabel.textContent = 'Correct answer:';
      correct.appendChild(correctLabel);
      correct.append(` ${entry.correctAnswer}`);
      card.append(question, selected, correct);
      reviewPanel.appendChild(card);
    });
  }

  function renderQuestion() {
    locked = false;
    const total = questions.length;
    const item = questions[current];

    qCounter.textContent = `Question ${current + 1} / ${total}`;
    qNumberLabel.textContent = `Question ${current + 1} of ${total}`;
    scoreCounter.textContent = `Score: ${score}`;
    progressFill.style.width = `${(current / total) * 100}%`;

    qText.textContent = item.q;
    feedback.className = 'feedback';
    feedback.textContent = '';
    nextBtn.className = 'next-btn';
    nextBtn.disabled = true;

    optionsWrap.innerHTML = '';
    item.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(idx, btn));
      optionsWrap.appendChild(btn);
    });

    // Move focus into the fresh option list so keyboard users always land
    // on interactive content, even though the previous Next button (which
    // triggered this render) is about to become hidden/disabled. Skip this
    // on the very first render so we don't steal focus on page load.
    if (hasRenderedOnce) {
      const firstOption = optionsWrap.querySelector('.option');
      if (firstOption) firstOption.focus();
    }
    hasRenderedOnce = true;
  }

  function handleAnswer(idx, btnEl) {
    if (locked) return;
    locked = true;
    const item = questions[current];
    answers[current] = idx;
    const buttons = optionsWrap.querySelectorAll('.option');
    buttons.forEach(b => b.disabled = true);

    if (idx === item.answer) {
      score++;
      btnEl.classList.add('correct');
      feedback.textContent = '✅ Correct! Well done, astronaut.';
      feedback.classList.add('correct');
    } else {
      btnEl.classList.add('wrong');
      buttons[item.answer].classList.add('correct');
      feedback.textContent = '❌ Not quite — houston, we have a problem.';
      feedback.classList.add('wrong');
    }
    scoreCounter.textContent = `Score: ${score}`;

    requestAnimationFrame(() => {
      feedback.classList.add('show');
      nextBtn.disabled = false;
      nextBtn.classList.add('show');
      nextBtn.focus();
    });
  }

  function nextQuestion() {
    current++;
    if (current >= questions.length) {
      progressFill.style.width = '100%';
      showResults();
    } else {
      renderQuestion();
    }
  }

  function showResults() {
    quizView.classList.add('hidden');
    resultsView.classList.remove('hidden');
    const total = questions.length;
    resultScore.textContent = `${score} / ${total}`;

    let emoji, title, msg;
    const pct = score / total;
    if (pct === 1) {
      emoji = '🏆'; title = 'Perfect Mission!';
      msg = 'Flawless! You truly are a space explorer.';
    } else if (pct >= 0.8) {
      emoji = '🚀'; title = 'Stellar Performance!';
      msg = 'Impressive knowledge of the cosmos!';
    } else if (pct >= 0.5) {
      emoji = '🛰️'; title = 'Solid Effort!';
      msg = 'You know your way around the solar system.';
    } else if (pct >= 0.3) {
      emoji = '👨‍🚀'; title = 'Still Training!';
      msg = 'A few more space facts and you\'ll be ready for launch.';
    } else {
      emoji = '🌑'; title = 'Lost in Space';
      msg = 'Time to hit the books before your next mission!';
    }
    resultEmoji.textContent = emoji;
    resultTitle.textContent = title;
    resultMsg.textContent = msg;
    renderReviewSummary();
    setReviewCollapsed(true);

    // Extra celebration for a great score (8+ out of 10).
    resultsView.classList.toggle('celebrate', score >= 8);
    document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
    if (score >= 8) {
      launchConfetti();
    }
  }

  function launchConfetti() {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;
    const colors = ['var(--accent)', 'var(--accent-2)', 'var(--correct)', '#ffd166'];
    const pieceCount = 26;
    for (let i = 0; i < pieceCount; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.setAttribute('aria-hidden', 'true');
      const left = Math.random() * 100;
      const drift = (Math.random() * 120 - 60).toFixed(0) + 'px';
      const duration = (1.6 + Math.random() * 1.2).toFixed(2) + 's';
      const delay = (Math.random() * 0.4).toFixed(2) + 's';
      const color = colors[Math.floor(Math.random() * colors.length)];
      piece.style.left = `${left}%`;
      piece.style.setProperty('--drift', drift);
      piece.style.background = color;
      piece.style.animationDuration = duration;
      piece.style.animationDelay = delay;
      if (Math.random() > 0.5) {
        piece.style.borderRadius = '50%';
      }
      resultsView.appendChild(piece);
      piece.addEventListener('animationend', () => piece.remove());
    }
  }

  function restart() {
    current = 0;
    score = 0;
    answers = [];
    resultsView.classList.add('hidden');
    resultsView.classList.remove('celebrate');
    document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
    quizView.classList.remove('hidden');
    reviewPanel.innerHTML = '';
    setReviewCollapsed(true);
    renderQuestion();
  }

  function runSelfTests() {
    const issues = [];
    function assert(condition, message) {
      if (!condition) issues.push(message);
    }

    const wrongAnswers = questions.map((q, i) => (i === 0 ? 0 : q.answer));
    score = questions.length - 1;
    answers = wrongAnswers;
    showResults();
    assert(reviewToggle.getAttribute('aria-expanded') === 'false', 'Review toggle should be collapsed by default.');
    assert(reviewPanel.hidden, 'Review panel should be hidden by default.');
    assert(reviewPanel.querySelectorAll('.review-item').length === 1, 'One missed question should be listed.');
    assert(reviewPanel.textContent.includes('Your answer:'), 'Review should include the selected answer label.');
    assert(reviewPanel.textContent.includes('Correct answer:'), 'Review should include the correct answer label.');

    score = questions.length;
    answers = questions.map(q => q.answer);
    showResults();
    assert(reviewPanel.querySelectorAll('.review-item').length === 0, 'Perfect score should not render missed-question cards.');
    assert(reviewPanel.textContent.includes('Perfect score!'), 'Perfect score should render congratulatory review note.');

    restart();
    assert(reviewPanel.innerHTML === '', 'Restart should clear the review panel content.');
    assert(reviewToggle.getAttribute('aria-expanded') === 'false', 'Restart should reset collapsed toggle state.');

    const output = document.createElement('p');
    output.style.fontSize = '12px';
    output.style.marginTop = '8px';
    output.style.fontFamily = 'var(--mono-font)';
    output.textContent = issues.length === 0
      ? 'Self-tests: PASS'
      : `Self-tests: FAIL (${issues.join(' | ')})`;
    document.querySelector('footer').appendChild(output);
  }

  reviewToggle.addEventListener('click', () => {
    const isExpanded = reviewToggle.getAttribute('aria-expanded') === 'true';
    setReviewCollapsed(isExpanded);
  });
  nextBtn.addEventListener('click', nextQuestion);
  restartBtn.addEventListener('click', restart);

  renderQuestion();
  if (new URLSearchParams(window.location.search).get('selfTest') === '1') {
    runSelfTests();
  }
})();
</script>
</body>
</html>
